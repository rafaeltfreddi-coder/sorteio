<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
</head>
<body>
<h1>Sorteio de Números</h1>
<p>informe os limites: superior e inferior do textos</p>

<label>Limite Inferior:</label>
<input type="number" id="LimiteInferior" step="1">
<br><br>
<label>Limite Superior:</label>
<input type="number" id="LimiteSuperior" step="1">
<br><br>
<button onclick="SortearNumero()">Sortear Número:</button>
<p id="resultado">O resultado aparecerá Aqui!</p>

<script>
function SortearNumero(){
const textoInferior = document.getElementById("LimiteInferior").value;
const textoSuperior = document.getElementById("LimiteSuperior").value;

const LimiteInferior = Number(textoInferior);
const LimiteSuperior = Number(textoSuperior);

const numeroAleatorio = Math.random();

const quantidadeNumeros = LimiteSuperior - LimiteInferior + 1;
const resultadoMultiplicado = numeroAleatorio * quantidadeNumeros;
const numeroSorteado = Math.floor(resultadoMultiplicado) + LimiteInferior;

document.getElementById("resultado").textContent = "Numero Sorteado: " + numeroSorteado;

}
</script>
</body>
</html>
